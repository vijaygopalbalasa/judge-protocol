<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 684 700" width="684" height="700" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5"><rect width="684" height="700" rx="10" fill="#14161f"/><circle cx="24" cy="19" r="5.5" fill="#ff5f57"/><circle cx="43" cy="19" r="5.5" fill="#febc2e"/><circle cx="62" cy="19" r="5.5" fill="#28c840"/><text x="342.0" y="23" fill="#6b7280" text-anchor="middle" font-size="11">Judge Protocol: a real ERC-8183 job judged on Arc, then independently recomputed</text><text x="18" y="69.5" fill="#5ec8e5" font-weight="600" opacity="0" xml:space="preserve"># Judge Protocol: deterministic evaluator for ERC-8183 agent escrow<animate attributeName="opacity" values="0;1;1" keyTimes="0;0.00000;1" dur="15.80s" repeatCount="indefinite" calcMode="discrete"/></text><text x="18" y="87.0" fill="#5ec8e5" font-weight="600" opacity="0" xml:space="preserve"># Live on Arc testnet. Judging a real job on Circle&#x27;s canonical contract.<animate attributeName="opacity" values="0;1;1" keyTimes="0;0.01899;1" dur="15.80s" repeatCount="indefinite" calcMode="discrete"/></text><text x="18" y="104.5" fill="#5ec8e5" font-weight="600" opacity="0" xml:space="preserve">## Step 1: post a job, provider delivers, judge settles the escrow<animate attributeName="opacity" values="0;1;1" keyTimes="0;0.03797;1" dur="15.80s" repeatCount="indefinite" calcMode="discrete"/></text><text x="18" y="122.0" fill="#5af78e" font-weight="600" opacity="0" xml:space="preserve">$ node --env-file=.env src/e2e.js<animate attributeName="opacity" values="0;1;1" keyTimes="0;0.05696;1" dur="15.80s" repeatCount="indefinite" calcMode="discrete"/></text><text x="18" y="139.5" fill="#f3d675" opacity="0" xml:space="preserve">=== E2E (PASS path): provider-authored deliverable ===<animate attributeName="opacity" values="0;1;1" keyTimes="0;0.07595;1" dur="15.80s" repeatCount="indefinite" calcMode="discrete"/></text><text x="18" y="157.0" fill="#ffffff" opacity="0" xml:space="preserve">1) client createJob (criteria only, evaluator = JudgeEvaluator)<animate attributeName="opacity" values="0;1;1" keyTimes="0;0.09494;1" dur="15.80s" repeatCount="indefinite" calcMode="discrete"/></text><text x="18" y="174.5" fill="#c8d0dd" opacity="0" xml:space="preserve">   jobId = 171507 | tx 0xaab42a2901a37c5869aa0a281f74e715622b0b13f1191b42b2a929d075802212<animate attributeName="opacity" values="0;1;1" keyTimes="0;0.11392;1" dur="15.80s" repeatCount="indefinite" calcMode="discrete"/></text><text x="18" y="192.0" fill="#ffffff" opacity="0" xml:space="preserve">2) SIGNER registers criteria hash on-chain (while Open, before submission)<animate attributeName="opacity" values="0;1;1" keyTimes="0;0.13291;1" dur="15.80s" repeatCount="indefinite" calcMode="discrete"/></text><text x="18" y="209.5" fill="#c8d0dd" opacity="0" xml:space="preserve">   criteriaHash 0x9b2b732563a22ef61ba2a48dd6f9eae1a59724926c1d7a3e21bfda21dcfff2d6 committed<animate attributeName="opacity" values="0;1;1" keyTimes="0;0.15190;1" dur="15.80s" repeatCount="indefinite" calcMode="discrete"/></text><text x="18" y="227.0" fill="#ffffff" opacity="0" xml:space="preserve">3) provider setBudget<animate attributeName="opacity" values="0;1;1" keyTimes="0;0.17089;1" dur="15.80s" repeatCount="indefinite" calcMode="discrete"/></text><text x="18" y="244.5" fill="#ffffff" opacity="0" xml:space="preserve">4) client approve + fund<animate attributeName="opacity" values="0;1;1" keyTimes="0;0.18987;1" dur="15.80s" repeatCount="indefinite" calcMode="discrete"/></text><text x="18" y="262.0" fill="#ffffff" opacity="0" xml:space="preserve">5) PROVIDER submit: deliverable hash + deliverable URI in optParams<animate attributeName="opacity" values="0;1;1" keyTimes="0;0.20886;1" dur="15.80s" repeatCount="indefinite" calcMode="discrete"/></text><text x="18" y="279.5" fill="#c8d0dd" opacity="0" xml:space="preserve">   provider 2.976747 USDC | client 2.895708 USDC, waiting for judge…<animate attributeName="opacity" values="0;1;1" keyTimes="0;0.22785;1" dur="15.80s" repeatCount="indefinite" calcMode="discrete"/></text><text x="18" y="297.0" fill="#c8d0dd" opacity="0" xml:space="preserve">   FINAL: Completed | provider 2.976747→3.976747 | client 2.895708→2.895708<animate attributeName="opacity" values="0;1;1" keyTimes="0;0.24684;1" dur="15.80s" repeatCount="indefinite" calcMode="discrete"/></text><text x="18" y="314.5" fill="#5af78e" opacity="0" xml:space="preserve">E2E RESULT: COMPLETED as expected ✓  jobId=171507<animate attributeName="opacity" values="0;1;1" keyTimes="0;0.26582;1" dur="15.80s" repeatCount="indefinite" calcMode="discrete"/></text><text x="18" y="332.0" fill="#5ec8e5" font-weight="600" opacity="0" xml:space="preserve">## Step 2: now recompute that verdict from PUBLIC inputs only<animate attributeName="opacity" values="0;1;1" keyTimes="0;0.28481;1" dur="15.80s" repeatCount="indefinite" calcMode="discrete"/></text><text x="18" y="349.5" fill="#5ec8e5" font-weight="600" opacity="0" xml:space="preserve">##         (anyone can do this; no access to the judge needed)<animate attributeName="opacity" values="0;1;1" keyTimes="0;0.30380;1" dur="15.80s" repeatCount="indefinite" calcMode="discrete"/></text><text x="18" y="367.0" fill="#5af78e" font-weight="600" opacity="0" xml:space="preserve">$ node --env-file=.env src/verify.js 171507 --evidence evidence/job-171507-7e5b8f88.json<animate attributeName="opacity" values="0;1;1" keyTimes="0;0.32278;1" dur="15.80s" repeatCount="indefinite" calcMode="discrete"/></text><text x="18" y="384.5" fill="#f3d675" opacity="0" xml:space="preserve">Verifying job 171507 on https://rpc.testnet.arc.io<animate attributeName="opacity" values="0;1;1" keyTimes="0;0.34177;1" dur="15.80s" repeatCount="indefinite" calcMode="discrete"/></text><text x="18" y="402.0" fill="#c8d0dd" opacity="0" xml:space="preserve">  ACP=0x0747EEf0706327138c69792bF28Cd525089e4583<animate attributeName="opacity" values="0;1;1" keyTimes="0;0.36076;1" dur="15.80s" repeatCount="indefinite" calcMode="discrete"/></text><text x="18" y="419.5" fill="#c8d0dd" opacity="0" xml:space="preserve">  Judge=0x6EFF7d4BB514d341AbEd90bF4c667d0A980173AD<animate attributeName="opacity" values="0;1;1" keyTimes="0;0.37975;1" dur="15.80s" repeatCount="indefinite" calcMode="discrete"/></text><text x="18" y="437.0" fill="#f3d675" opacity="0" xml:space="preserve">Job status: Completed · on-chain verdict: PASS score=100 threshold=100<animate attributeName="opacity" values="0;1;1" keyTimes="0;0.39873;1" dur="15.80s" repeatCount="indefinite" calcMode="discrete"/></text><text x="18" y="454.5" fill="#5af78e" opacity="0" xml:space="preserve">  ✓ criteriaHash recomputed from description matches signed verdict<animate attributeName="opacity" values="0;1;1" keyTimes="0;0.41772;1" dur="15.80s" repeatCount="indefinite" calcMode="discrete"/></text><text x="18" y="472.0" fill="#7c8699" opacity="0" xml:space="preserve">      recomputed=0x9b2b732563a22ef61ba2a48dd6f9eae1a59724926c1d7a3e21bfda21dcfff2d6<animate attributeName="opacity" values="0;1;1" keyTimes="0;0.43671;1" dur="15.80s" repeatCount="indefinite" calcMode="discrete"/></text><text x="18" y="489.5" fill="#7c8699" opacity="0" xml:space="preserve">      onchain   =0x9b2b732563a22ef61ba2a48dd6f9eae1a59724926c1d7a3e21bfda21dcfff2d6<animate attributeName="opacity" values="0;1;1" keyTimes="0;0.45570;1" dur="15.80s" repeatCount="indefinite" calcMode="discrete"/></text><text x="18" y="507.0" fill="#5af78e" opacity="0" xml:space="preserve">  ✓ deliverable content (evidence.deliverableURI) hashes to the committed bytes32<animate attributeName="opacity" values="0;1;1" keyTimes="0;0.47468;1" dur="15.80s" repeatCount="indefinite" calcMode="discrete"/></text><text x="18" y="524.5" fill="#7c8699" opacity="0" xml:space="preserve">      recomputed=0x4c5568398a9872a61017f57d995c215d9f2d1a2554c8a8834b5ab00b0d136d3a<animate attributeName="opacity" values="0;1;1" keyTimes="0;0.49367;1" dur="15.80s" repeatCount="indefinite" calcMode="discrete"/></text><text x="18" y="542.0" fill="#7c8699" opacity="0" xml:space="preserve">      committed =0x4c5568398a9872a61017f57d995c215d9f2d1a2554c8a8834b5ab00b0d136d3a<animate attributeName="opacity" values="0;1;1" keyTimes="0;0.51266;1" dur="15.80s" repeatCount="indefinite" calcMode="discrete"/></text><text x="18" y="559.5" fill="#5af78e" opacity="0" xml:space="preserve">  ✓ score recomputed = on-chain score  (recomputed 100, onchain 100)<animate attributeName="opacity" values="0;1;1" keyTimes="0;0.53165;1" dur="15.80s" repeatCount="indefinite" calcMode="discrete"/></text><text x="18" y="577.0" fill="#5af78e" opacity="0" xml:space="preserve">  ✓ threshold recomputed = on-chain threshold  (recomputed 100, onchain 100)<animate attributeName="opacity" values="0;1;1" keyTimes="0;0.55063;1" dur="15.80s" repeatCount="indefinite" calcMode="discrete"/></text><text x="18" y="594.5" fill="#5af78e" opacity="0" xml:space="preserve">  ✓ pass/reject decision matches  (recomputed true, onchain true)<animate attributeName="opacity" values="0;1;1" keyTimes="0;0.56962;1" dur="15.80s" repeatCount="indefinite" calcMode="discrete"/></text><text x="18" y="612.0" fill="#5af78e" opacity="0" xml:space="preserve">  ✓ evidenceHash recomputed from inputs = on-chain evidenceHash<animate attributeName="opacity" values="0;1;1" keyTimes="0;0.58861;1" dur="15.80s" repeatCount="indefinite" calcMode="discrete"/></text><text x="18" y="629.5" fill="#7c8699" opacity="0" xml:space="preserve">      recomputed=0x7e5b8f886a8fee32e9a041c89993ec625c649be2942a2b1a058d32db5a55300d<animate attributeName="opacity" values="0;1;1" keyTimes="0;0.60759;1" dur="15.80s" repeatCount="indefinite" calcMode="discrete"/></text><text x="18" y="647.0" fill="#7c8699" opacity="0" xml:space="preserve">      onchain   =0x7e5b8f886a8fee32e9a041c89993ec625c649be2942a2b1a058d32db5a55300d<animate attributeName="opacity" values="0;1;1" keyTimes="0;0.62658;1" dur="15.80s" repeatCount="indefinite" calcMode="discrete"/></text><text x="18" y="664.5" fill="#5af78e" font-weight="600" opacity="0" xml:space="preserve">VERDICT VERIFIED: recomputed independently from public inputs.<animate attributeName="opacity" values="0;1;1" keyTimes="0;0.64557;1" dur="15.80s" repeatCount="indefinite" calcMode="discrete"/></text><text x="18" y="682.0" fill="#5ec8e5" font-weight="600" opacity="0" xml:space="preserve"># The judge cannot lie without being caught. That&#x27;s the whole point.<animate attributeName="opacity" values="0;1;1" keyTimes="0;0.66456;1" dur="15.80s" repeatCount="indefinite" calcMode="discrete"/></text></svg>