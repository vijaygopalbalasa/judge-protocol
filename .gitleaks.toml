title = "Judge Protocol gitleaks config"

# Start from gitleaks' built-in ruleset, then add project allowlists below.
[extend]
useDefault = true

[allowlist]
description = "Well-known PUBLIC Anvil dev keys, used only in a local integration harness (removed 2026-09-30; still in git history). These are Foundry's documented default accounts (0/1/2), not secrets, and never used on any live network."
regexes = [
  '''0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80''',
  '''0x59c6995e998f97a5a0044966f0945389dc9e86dae88c7a8412f4603b6b78690d''',
  '''0x5de4111afa1a4b94908f83103eb1f1706367c2e68ca870fc69fb9a804cdab365''',
]
paths = [
  '''judge-service/src/integrated-test\.js''',
]
