[profile.default]
src = "src"
out = "out"
libs = ["lib"]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/"
]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false

# ArcBounty's BountyAdapter (vendored under test/vendor/arcbounty for the JudgeArbitrator tests only) needs
# via-IR, as it does in their own repo. Only those files, and test files that import them, compile with it;
# everything under src keeps the settings above.
additional_compiler_profiles = [ { name = "via-ir", via_ir = true } ]
compilation_restrictions = [ { paths = "test/vendor/arcbounty/**", via_ir = true } ]
