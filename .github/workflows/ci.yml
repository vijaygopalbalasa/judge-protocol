name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  contracts:
    name: Contracts (forge)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: forge build
        working-directory: contracts
        run: forge build --sizes
      - name: forge test
        working-directory: contracts
        run: forge test -vvv

  service:
    name: Judge service (node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: install
        working-directory: judge-service
        run: npm ci
      - name: test
        working-directory: judge-service
        run: npm test

  web:
    name: Web verifier (node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: install service deps (parity tests import the service's own checkers)
        working-directory: judge-service
        run: npm ci
      - name: test
        run: node --test 'web/test/*.test.mjs'

  kit:
    name: Kit and docs (node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: install service deps (parity tests import the service's own code)
        working-directory: judge-service
        run: npm ci
      - name: install kit deps
        working-directory: kit
        run: npm ci
      - name: test
        working-directory: kit
        run: npm test

  agent:
    name: Paymaster agent (node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: install deps (the agent reuses the kit and the judge service's own code)
        run: |
          npm ci --prefix judge-service
          npm ci --prefix kit
          npm ci --prefix agent
      - name: test
        working-directory: agent
        run: npm test

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          VER=$(curl -s https://api.github.com/repos/gitleaks/gitleaks/releases/latest | grep -o '"tag_name": *"[^"]*"' | cut -d'"' -f4)
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/${VER}/gitleaks_${VER#v}_linux_x64.tar.gz" | tar xz gitleaks
          echo "$PWD" >> "$GITHUB_PATH"
      - name: Scan full git history
        run: gitleaks git --config .gitleaks.toml --verbose --redact .
