name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  contracts:
    name: Contracts (forge)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: forge build
        working-directory: contracts
        run: forge build --sizes
      - name: forge test
        working-directory: contracts
        run: forge test -vvv

  service:
    name: Judge service (node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: install
        working-directory: judge-service
        run: npm ci
      - name: test
        working-directory: judge-service
        run: npm test

  web:
    name: Web verifier (node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: install service deps (parity tests import the service's own checkers)
        working-directory: judge-service
        run: npm ci
      - name: test
        run: node --test 'web/test/*.test.mjs'

  kit:
    name: Kit and docs (node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: install service deps (parity tests import the service's own code)
        working-directory: judge-service
        run: npm ci
      - name: install kit deps
        working-directory: kit
        run: npm ci
      - name: test
        working-directory: kit
        run: npm test

  agent:
    name: Paymaster agent (node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: install deps (the agent reuses the kit and the judge service's own code)
        run: |
          npm ci --prefix judge-service
          npm ci --prefix kit
          npm ci --prefix agent
      - name: test
        working-directory: agent
        run: npm test

  mcp:
    name: MCP server (node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: install deps (the server reuses web/builder.js and web/app.js, which need none)
        working-directory: mcp
        run: npm ci
      - name: test
        working-directory: mcp
        run: npm test

  rvr:
    name: ERC-8404 profile (python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: profile gate (standard library only)
        working-directory: rvr
        run: python profiles/judge-protocol-rvr-v0/adapter.py --check > /dev/null
      - name: profile test
        working-directory: rvr
        run: python profiles/judge-protocol-rvr-v0/test_profile.py
      - name: mutation check (every mutant must fail the gate in the case written for it)
        working-directory: rvr
        run: python mutants.py
      - name: word-character table equals Unicode 17.0.0 (SPEC, judge and verifier copies)
        working-directory: rvr
        run: |
          curl -sSf -o "$RUNNER_TEMP/DerivedGeneralCategory.txt" https://www.unicode.org/Public/17.0.0/ucd/extracted/DerivedGeneralCategory.txt
          python word_ranges.py "$RUNNER_TEMP/DerivedGeneralCategory.txt"

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        # Pinned and checksum-verified: asking the API for "latest" fails when unauthenticated calls are rate-limited.
        run: |
          VER=8.30.1
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
          echo "$PWD" >> "$GITHUB_PATH"
      - name: Scan full git history
        run: gitleaks git --config .gitleaks.toml --verbose --redact .
